name: Pages redirect

# Постоянная ссылка https://<user>.github.io/bingo/ ведёт на текущий сервер игры (переменная APP_URL).
# Сменился сервер — обновите APP_URL и перезапустите этот workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Build redirect page
        run: |
          case "$APP_URL" in https://*) ;; *) echo "APP_URL должен начинаться с https://"; exit 1 ;; esac
          mkdir -p _site
          sed "s#__APP_URL__#${APP_URL%/}#g" pages/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
